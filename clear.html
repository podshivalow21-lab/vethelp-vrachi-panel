<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store"><title>Сброс кэша</title>
<style>body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-size:20px}</style>
</head><body><p>Сбрасываю кэш…</p>
<script>
(function(){
  var done=false;
  function go(){if(done)return;done=true;location.replace('./index.html?fresh=1');}
  setTimeout(go,1200);
  try{localStorage.removeItem('vethelp-panel-pwa-installed');}catch(e){}
  var p=[];
  if('serviceWorker' in navigator){p.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister();}));}).catch(function(){}));}
  if(window.caches){p.push(caches.keys().then(function(k){return Promise.all(k.map(function(n){return caches.delete(n);}));}).catch(function(){}));}
  Promise.all(p).then(function(){setTimeout(go,300);});
})();
</script></body></html>
